<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QuizBot AI — Chatbot Latihan Soal</title>
<style>
  :root{
    color-scheme:dark;
    --bg:#0C1211; --panel:#141D1B; --bubble-bot:#192320; --bubble-user:#203B32;
    --ink:#F1F5F1; --muted:#94A79F; --accent:#70E0B8; --wrong:#FF8277; --line:#293832;
    --focus:rgba(112,224,184,.32);
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%; min-height:100%; margin:0;}
  body{
    background:
      radial-gradient(ellipse at 50% -15%, rgba(50,112,87,.2), transparent 55%),
      var(--bg);
    color:var(--ink); font-family:Georgia,'Iowan Old Style',serif;
    display:flex; justify-content:center; padding:clamp(10px,3vw,28px);
  }
  button,input{font:inherit;}
  button:focus-visible,input:focus-visible{outline:3px solid var(--focus); outline-offset:2px;}
  .app{
    width:100%; max-width:620px; display:flex; flex-direction:column;
    height:calc(100dvh - clamp(20px,6vw,56px)); max-height:900px; min-height:0;
    overflow:hidden; border:1px solid rgba(148,167,159,.12); border-radius:22px;
    background:rgba(17,25,23,.86); box-shadow:0 24px 90px rgba(0,0,0,.35);
    backdrop-filter:blur(16px);
  }
  header{ padding:20px 22px 17px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .brand{display:flex; align-items:center; gap:12px; min-width:0;}
  .brand-mark{
    display:grid; place-items:center; flex:none; width:42px; height:42px; border-radius:14px;
    background:linear-gradient(145deg,#94f0cb,#49bd96); color:#10231c;
    font:700 1.05rem Arial,sans-serif; box-shadow:0 7px 22px rgba(92,200,166,.2);
  }
  header h1{ font-size:1.22rem; font-weight:600; letter-spacing:-.025em; margin:0 0 4px; }
  header p{ font-family:Arial,sans-serif; color:var(--muted); font-size:.76rem; margin:0; }
  .badge{ display:inline-flex; align-items:center; gap:7px; font-family:Arial,sans-serif; font-size:.7rem; color:var(--accent); border:1px solid rgba(112,224,184,.26); background:rgba(112,224,184,.07); padding:7px 10px; border-radius:999px; white-space:nowrap; }
  .badge::before{content:""; width:7px; height:7px; border-radius:50%; background:currentColor; box-shadow:0 0 10px currentColor;}
  .quiz-progress{padding:13px 22px 14px; border-bottom:1px solid rgba(41,56,50,.72);}
  .progress-meta{display:flex; justify-content:space-between; gap:12px; margin-bottom:8px; font: .72rem Arial,sans-serif; color:var(--muted);}
  .progress-meta strong{color:var(--ink); font-weight:600;}
  .progress-track{height:5px; overflow:hidden; border-radius:8px; background:#26332e;}
  .progress-fill{height:100%; width:0; border-radius:inherit; background:linear-gradient(90deg,#47bd91,var(--accent)); transition:width .35s ease;}
  .chat{ flex:1; min-height:0; overflow-y:auto; padding:20px 22px; display:flex; flex-direction:column; gap:14px; scroll-behavior:smooth; overscroll-behavior:contain; }
  .row{ display:flex; }
  .row.bot{ justify-content:flex-start; }
  .row.user{ justify-content:flex-end; }
  .bubble{ max-width:min(91%,500px); padding:14px 16px; border:1px solid transparent; border-radius:17px; font-size:.91rem; line-height:1.55; font-family:Arial,sans-serif; animation:rise-in .2s ease-out both; }
  .bot .bubble{ background:var(--bubble-bot); border-color:rgba(148,167,159,.08); border-top-left-radius:5px; }
  .user .bubble{ background:var(--bubble-user); border-color:rgba(112,224,184,.11); border-top-right-radius:5px; }
  .opts{ display:flex; flex-direction:column; gap:8px; margin-top:13px; }
  .opt{
    display:flex; align-items:flex-start; gap:10px; width:100%;
    font-family:Arial,sans-serif; text-align:left; background:rgba(255,255,255,.015); color:var(--ink);
    border:1px solid var(--line); padding:11px 12px; border-radius:11px; cursor:pointer; font-size:.86rem; line-height:1.4;
    transition:border-color .15s,background .15s,transform .15s;
  }
  .opt::before{content:""; display:block; flex:none; width:8px; height:8px; margin-top:4px; border:1px solid var(--muted); border-radius:50%;}
  .opt:hover:not(:disabled){ border-color:var(--accent); background:rgba(112,224,184,.06); transform:translateY(-1px); }
  .opt:disabled{ cursor:default; }
  .opt.correct{ border-color:var(--accent); background:rgba(112,224,184,.1); }
  .opt.correct::before{border-color:var(--accent); background:var(--accent); box-shadow:inset 0 0 0 2px var(--bubble-bot);}
  .opt.wrong{ border-color:var(--wrong); background:rgba(255,130,119,.09); }
  .opt.wrong::before{border-color:var(--wrong); background:var(--wrong);}
  .topic-grid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:15px; }
  .topic-btn{
    min-height:48px; font-family:Arial,sans-serif; background:rgba(255,255,255,.02); color:var(--ink); border:1px solid var(--line);
    padding:11px 12px; border-radius:11px; cursor:pointer; font-size:.8rem; font-weight:500; text-align:left;
    transition:border-color .15s,background .15s,transform .15s;
  }
  .topic-btn:hover:not(:disabled){ border-color:var(--accent); background:rgba(112,224,184,.06); transform:translateY(-1px); }
  .topic-btn:disabled,.action-btn:disabled{opacity:.55; cursor:wait;}
  .custom-row{ display:flex; gap:9px; margin-top:13px; }
  .custom-row input{
    min-width:0; flex:1; font-family:Arial,sans-serif; background:#101816; border:1px solid var(--line); color:var(--ink);
    padding:11px 12px; border-radius:10px; font-size:.82rem;
  }
  .custom-row input::placeholder{color:#71847c;}
  .quiz-settings{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(41,56,50,.7);}
  .setting-field{display:flex;flex-direction:column;gap:6px;font: .68rem Arial,sans-serif;color:var(--muted);}
  .setting-field select{width:100%;min-height:42px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#101816;color:var(--ink);font: .78rem Arial,sans-serif;}
  .history-summary{margin-top:12px;}
  .history-topic{margin:13px 0 4px;color:var(--accent);font-weight:700;}
  .history-attempt{font-family:Arial,sans-serif;font-size:.75rem;color:var(--muted);padding:6px 0;border-bottom:1px solid rgba(41,56,50,.7);}
  .review-list{display:flex;flex-direction:column;gap:11px;margin-top:13px;}
  .review-item{padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.015);}
  .review-question{font-weight:600;margin-bottom:8px;}
  .review-answer{font-size:.81rem;margin-top:5px;}
  .review-answer.correct{color:var(--accent);}
  .review-answer.incorrect{color:#ffb1a8;}
  .review-explain{font-size:.78rem;color:var(--muted);margin-top:7px;}
  .typing{ display:flex; align-items:center; gap:10px; color:var(--muted); font-size:.82rem; }
  .typing::before{content:""; width:14px; height:14px; border:2px solid rgba(112,224,184,.25); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite;}
  footer{ min-height:62px; padding:12px 22px max(14px,env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:rgba(12,18,17,.55); }
  .action-btn{
    font-family:Arial,sans-serif; background:var(--accent); color:#10231c; border:1px solid transparent;
    padding:10px 15px; border-radius:10px; cursor:pointer; font-size:.8rem; font-weight:700; margin:0 7px 0 0;
    transition:filter .15s,transform .15s;
  }
  .action-btn:hover:not(:disabled){filter:brightness(1.08); transform:translateY(-1px);}
  .action-btn.ghost{ background:transparent; color:var(--ink); border-color:var(--line); }
  .result-score{font-size:1.12rem; font-weight:700; color:var(--accent);}
  .feedback-title{font-weight:700;}
  .error-note{color:#ffb1a8;}
  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background:#34443d; border-radius:4px; }
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes rise-in{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
  @media(max-width:520px){
    body{padding:0;background:var(--bg);}
    .app{height:100%;height:100dvh;max-height:none;border:0;border-radius:0;}
    header{padding:15px 16px;}
    .brand-mark{width:38px;height:38px;border-radius:12px;}
    .quiz-progress{padding:12px 16px;}
    .chat{padding:17px 15px;gap:12px;}
    .bubble{max-width:95%;padding:12px 13px;}
    footer{padding-left:16px;padding-right:16px;}
    .quiz-settings{gap:7px;}
    .setting-field select{font-size:.74rem;}
  }
  @media(max-width:360px){header p{font-size:.68rem;}.badge{font-size:.63rem;padding:6px 8px;}.topic-grid{grid-template-columns:1fr;}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">Q</span>
      <div><h1>QuizBot AI</h1><p>Latihan personal, dibuat khusus untukmu</p></div>
    </div>
    <span class="badge" id="badge" role="status" aria-live="polite">Menghubungkan</span>
  </header>
  <section class="quiz-progress" id="quizProgress" aria-label="Kemajuan kuis" hidden>
    <div class="progress-meta"><strong id="progressLabel">Kuis</strong><span id="scoreLabel">Skor 0</span></div>
    <div class="progress-track" role="progressbar" aria-label="Kemajuan kuis" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </section>
  <div class="chat" id="chat" role="log" aria-live="polite" aria-relevant="additions text" aria-label="Percakapan kuis"></div>
  <footer id="footer"></footer>
</div>

<script>
const TOPICS = ["Struktur Data","Kecerdasan Buatan","Basis Data","Jaringan Komputer"];
const chat = document.getElementById('chat');
const footer = document.getElementById('footer');
const badge = document.getElementById('badge');
const quizProgress = document.getElementById('quizProgress');
const progressLabel = document.getElementById('progressLabel');
const scoreLabel = document.getElementById('scoreLabel');
const progressTrack = document.querySelector('.progress-track');
const progressFill = document.getElementById('progressFill');
let aiAvailable = false;
let requestingQuestions = false;
let historyShown = false;
let retryCooldownTimer = null;
let state = {};

function updateProgress(complete = false){
  if(!state.qs || state.qs.length === 0){
    quizProgress.hidden = true;
    return;
  }
  quizProgress.hidden = false;
  const {idx, score, qs} = state;
  const progress = complete ? 100 : Math.round((idx / qs.length) * 100);
  progressLabel.textContent = complete ? 'Kuis selesai' : `Soal ${idx + 1} dari ${qs.length}`;
  scoreLabel.textContent = `Skor ${score}`;
  progressFill.style.width = `${progress}%`;
  progressTrack.setAttribute('aria-valuenow', String(progress));
}

function setTopicControlsDisabled(disabled){
  document.querySelectorAll('.topic-btn, #customTopic, #customGo').forEach(control=>{
    control.disabled = disabled;
  });
}

function escapeHtml(value){
  return String(value).replace(/[&<>"']/g, char=>({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  })[char]);
}

async function apiRequest(path, payload){
  const response = await fetch(path, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(payload)
  });
  let result;
  try{
    result = await response.json();
  }catch{
    throw new Error('Server mengirim respons yang tidak bisa dibaca. Coba lagi sebentar.');
  }
  if(!response.ok){
    const error = new Error(result.error || 'Permintaan ke AI gagal.');
    error.retryAfter = Number(response.headers.get('Retry-After')) || 0;
    throw error;
  }
  return result;
}

function addBot(html){
  const row = document.createElement('div');
  row.className = 'row bot';
  row.innerHTML = `<div class="bubble">${html}</div>`;
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return row.querySelector('.bubble');
}
function addUser(text){
  const row = document.createElement('div');
  row.className = 'row user';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  row.appendChild(bubble);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}
function addTyping(label){
  const row = document.createElement('div');
  row.className = 'row bot';
  const bubble = document.createElement('div');
  bubble.className = 'bubble typing';
  bubble.textContent = label;
  row.appendChild(bubble);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return row;
}

function getHistory(){
  try{
    const value = JSON.parse(localStorage.getItem('quizbot_history')||'{}');
    if(!value || typeof value !== 'object' || Array.isArray(value)) return {};
    return Object.fromEntries(Object.entries(value).map(([topic, attempts])=>[
      topic,
      Array.isArray(attempts) ? attempts.filter(attempt=>
        attempt &&
        Number.isFinite(attempt.score) &&
        Number.isFinite(attempt.total) &&
        attempt.total > 0 &&
        attempt.score >= 0 &&
        attempt.score <= attempt.total
      ) : []
    ]).filter(([,attempts])=>attempts.length));
  }catch(e){ return {}; }
}
function saveHistory(topic, score, total, difficulty){
  try{
    const h = getHistory();
    if(!h[topic]) h[topic] = [];
    h[topic].push({score, total, difficulty, t: Date.now()});
    h[topic] = h[topic].slice(-20);
    localStorage.setItem('quizbot_history', JSON.stringify(h));
  }catch(e){}
}
function weakestTopic(){
  const h = getHistory();
  let worst=null, worstPct=1.01;
  Object.keys(h).forEach(t=>{
    const arr=h[t]; const s=arr.reduce((a,b)=>a+b.score,0); const tt=arr.reduce((a,b)=>a+b.total,0);
    const pct = tt? s/tt : 1;
    if(pct<worstPct){ worstPct=pct; worst=t; }
  });
  return worst;
}

function quizSettings(){
  return {
    count:Number(document.getElementById('questionCount').value),
    difficulty:document.getElementById('difficulty').value
  };
}

function appendQuizSettings(bubble){
  const settings = document.createElement('div');
  settings.className = 'quiz-settings';
  settings.innerHTML = `
    <label class="setting-field">Jumlah soal
      <select id="questionCount" aria-label="Jumlah soal">
        <option value="5" selected>5 soal</option><option value="10">10 soal</option><option value="15">15 soal</option>
      </select>
    </label>
    <label class="setting-field">Kesulitan
      <select id="difficulty" aria-label="Tingkat kesulitan">
        <option value="Mudah">Mudah</option><option value="Sedang" selected>Sedang</option><option value="Sulit">Sulit</option>
      </select>
    </label>`;
  bubble.appendChild(settings);
}

function retryButton(topic, settings, retryAfter = 0){
  if(retryCooldownTimer){
    clearInterval(retryCooldownTimer);
    retryCooldownTimer = null;
  }
  const footerMarkup = `<button class="action-btn" id="retryQuizBtn">Coba lagi</button><button class="action-btn ghost" id="backBtn">Pilih topik lain</button>`;
  footer.innerHTML = footerMarkup;
  const retry = document.getElementById('retryQuizBtn');
  document.getElementById('backBtn').onclick = start;
  retry.onclick = ()=>{
    retry.disabled = true;
    pickTopic(topic, settings);
  };
  if(retryAfter > 0){
    retry.disabled = true;
    const deadline = Date.now() + retryAfter * 1000;
    const update = ()=>{
      const seconds = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
      retry.textContent = `Coba lagi (${seconds} dtk)`;
      if(seconds <= 0){
        clearInterval(retryCooldownTimer);
        retryCooldownTimer = null;
        retry.disabled = false;
        retry.textContent = 'Coba lagi';
      }
    };
    update();
    retryCooldownTimer = setInterval(update, 1000);
  }
}

async function init(){
  try{
    const response = await fetch('/api/health');
    const health = await response.json();
    if(!response.ok) throw new Error(health.error || 'Server tidak tersedia.');
    if(!health.configured) throw new Error(health.setupMessage || 'GEMINI_API_KEY belum diatur.');
    aiAvailable = true;
    badge.textContent = "Gemini aktif";
  }catch(error){
    aiAvailable = false;
    badge.textContent = error.message.includes('GEMINI_API_KEY')
      ? "API key belum diatur"
      : "AI tidak tersedia";
    badge.style.borderColor = 'var(--wrong)';
    badge.style.color = 'var(--wrong)';
    badge.title = error.message;
  }
  start();
}

function start(){
  if(retryCooldownTimer){
    clearInterval(retryCooldownTimer);
    retryCooldownTimer = null;
  }
  requestingQuestions = false;
  historyShown = false;
  state = {};
  quizProgress.hidden = true;
  setTopicControlsDisabled(false);
  chat.innerHTML=''; footer.innerHTML='';
  const h = getHistory();
  const hasHistory = Object.keys(h).length>0;
  let msg = "Halo! Aku QuizBot. Pilih topik di bawah, atau ketik topik sendiri, nanti AI akan membuatkan soal khusus untukmu.";
  if(hasHistory){
    const weak = weakestTopic();
    if(weak) msg += ` Dari riwayatmu, topik <b>${escapeHtml(weak)}</b> kelihatannya masih perlu banyak latihan.`;
  }
  const b = addBot(msg);
  const grid = document.createElement('div');
  grid.className='topic-grid';
  TOPICS.forEach(t=>{
    const btn=document.createElement('button');
    btn.className='topic-btn'; btn.textContent=t;
    btn.onclick=()=>{ addUser(t); pickTopic(t); };
    grid.appendChild(btn);
  });
  b.appendChild(grid);
  appendQuizSettings(b);
  const customRow = document.createElement('div');
  customRow.className='custom-row';
  customRow.innerHTML = `<input id="customTopic" maxlength="120" aria-label="Topik kuis sendiri" placeholder="Tulis topik lain..." /><button class="action-btn" id="customGo">Buat kuis</button>`;
  b.appendChild(customRow);
  document.getElementById('customGo').onclick = ()=>{
    const v = document.getElementById('customTopic').value.trim();
    if(v){ addUser(v); pickTopic(v); }
    else document.getElementById('customTopic').focus();
  };
  document.getElementById('customTopic').onkeydown = (e)=>{ if(e.key==='Enter') document.getElementById('customGo').click(); };
  if(hasHistory){
    footer.innerHTML = `<button class="action-btn ghost" id="histBtn">Lihat Riwayat</button>`;
    document.getElementById('histBtn').onclick = showHistory;
  }
}

function showHistory(){
  if(historyShown) return;
  historyShown = true;
  const historyButton = document.getElementById('histBtn');
  if(historyButton) historyButton.remove();
  const h = getHistory();
  const lines = Object.keys(h).map(topic=>{
    const attempts = h[topic];
    const last = attempts[attempts.length-1];
    const best = attempts.reduce((top, attempt)=>
      attempt.score / attempt.total > top.score / top.total ? attempt : top
    );
    const recent = attempts.slice(-5).reverse().map(attempt=>{
      const date = new Date(attempt.t).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
      const level = attempt.difficulty ? ` · ${escapeHtml(attempt.difficulty)}` : '';
      return `<div class="history-attempt">${date}${level} — ${attempt.score}/${attempt.total} (${Math.round(attempt.score/attempt.total*100)}%)</div>`;
    }).join('');
    return `<div class="history-summary"><div class="history-topic">${escapeHtml(topic)}</div><div class="stat-line">Terakhir ${last.score}/${last.total} · Terbaik ${best.score}/${best.total} · ${attempts.length} percobaan</div>${recent}</div>`;
  }).join('');
  addUser('Lihat riwayat');
  addBot(`<strong>Riwayat latihan</strong>${lines || '<div class="stat-line">Belum ada percobaan.</div>'}`);
}

async function pickTopic(topic, options = quizSettings()){
  if(requestingQuestions) return;
  footer.innerHTML='';
  if(!aiAvailable){
    addBot(`<span class="error-note">Gemini belum siap:</span> ${escapeHtml(badge.title || 'Periksa koneksi server dan pengaturan API.')}`);
    footer.innerHTML = `<button class="action-btn ghost" id="backBtn">Kembali</button>`;
    document.getElementById('backBtn').onclick = start;
    return;
  }
  requestingQuestions = true;
  setTopicControlsDisabled(true);
  state = {topic, count:options.count, difficulty:options.difficulty};
  const typingRow = addTyping("QuizBot sedang menyusun soal tentang " + topic + "...");
  let questions = null;
  try{
    const result = await apiRequest('/api/questions', {topic, ...options});
    questions = result.questions;
  }catch(error){
    questions = null;
    addBot(`<span class="error-note">Belum berhasil membuat soal.</span><br>${escapeHtml(error.message)}`);
    state.retryAfter = error.retryAfter || 0;
  }
  typingRow.remove();
  if(!questions || questions.length===0){
    requestingQuestions = false;
    setTopicControlsDisabled(false);
    retryButton(topic, options, state.retryAfter);
    return;
  }
  requestingQuestions = false;
  state = {topic, qs: questions, idx:0, score:0, answers:[], difficulty:options.difficulty};
  updateProgress();
  addBot(`Oke, ini ${questions.length} soal tentang <b>${escapeHtml(topic)}</b>, langsung dibuat oleh AI. Semangat!`);
  setTimeout(askQuestion, 250);
}

function askQuestion(){
  const {qs, idx} = state;
  const q = qs[idx];
  updateProgress();
  const b = addBot(`Soal ${idx+1}/${qs.length}: ${escapeHtml(q.q)}`);
  const wrap = document.createElement('div');
  wrap.className='opts';
  q.opts.forEach((o,i)=>{
    const btn=document.createElement('button');
    btn.className='opt'; btn.textContent=o;
    btn.onclick=()=>answer(i, wrap);
    wrap.appendChild(btn);
  });
  b.appendChild(wrap);
}

function answer(i, wrap){
  const {qs, idx} = state;
  const q = qs[idx];
  addUser(q.opts[i]);
  [...wrap.children].forEach((btn,bi)=>{
    btn.disabled=true;
    if(bi===q.a) btn.classList.add('correct');
    else if(bi===i) btn.classList.add('wrong');
  });
  const correct = i===q.a;
  state.answers[idx] = i;
  if(correct) state.score++;
  updateProgress();
  setTimeout(()=>{
    const explain = q.explain ? ` ${escapeHtml(q.explain)}` : '';
    addBot(correct ? `Benar!${explain}` : `Kurang tepat, jawaban yang benar: <b>${escapeHtml(q.opts[q.a])}</b>.${explain}`);
    state.idx++;
    setTimeout(()=>{
      if(state.idx < qs.length) askQuestion();
      else finish();
    }, 500);
  }, 300);
}

async function finish(){
  const {topic, score, qs, difficulty} = state;
  saveHistory(topic, score, qs.length, difficulty);
  const pct = Math.round((score/qs.length)*100);
  updateProgress(true);
  const encouragement = pct >= 80 ? 'Hebat! Pemahamanmu sudah kuat.' :
    pct >= 50 ? 'Bagus, sedikit lagi makin mantap.' :
    'Terus latihan, kamu pasti makin paham.';
  addBot(`<span class="result-score">${score}/${qs.length} · ${pct}%</span><br>${encouragement}`);
  const review = qs.map((question,index)=>{
    const selected = state.answers[index];
    const correct = selected === question.a;
    return `<div class="review-item"><div class="review-question">${index+1}. ${escapeHtml(question.q)}</div><div class="review-answer ${correct?'correct':'incorrect'}">${correct?'✓ Benar':'✕ Jawabanmu'}: ${escapeHtml(question.opts[selected])}</div>${correct?'':`<div class="review-answer correct">Jawaban benar: ${escapeHtml(question.opts[question.a])}</div>`}${question.explain?`<div class="review-explain">${escapeHtml(question.explain)}</div>`:''}</div>`;
  }).join('');
  addBot(`<strong>Ulasan jawaban</strong><div class="review-list">${review}</div>`);
  footer.innerHTML = `
    <button class="action-btn" id="retryBtn">Coba Topik Lain</button>
    <button class="action-btn ghost" id="againBtn">Ulangi Topik Ini</button>
  `;
  document.getElementById('retryBtn').onclick = start;
  document.getElementById('againBtn').onclick = ()=>pickTopic(topic);

  if(aiAvailable){
    const typingRow = addTyping("QuizBot sedang menyiapkan tips belajar...");
    try{
      const result = await apiRequest('/api/tip', {topic, score, total:qs.length});
      typingRow.remove();
      addBot(`<span class="feedback-title">Tips belajar</span><br>${escapeHtml(result.tip)}`);
    }catch(error){
      typingRow.remove();
      addBot(`Skormu tetap tersimpan. Tips belajar belum tersedia: ${escapeHtml(error.message)}`);
    }
  }
}

init();
</script>
